<!--
  Template · copia esta carpeta para empezar una pieza nueva.
  Mapeo Django:
    {{ item.title }} → .component-name__title   el titular
    {{ item.text }}  → .component-name__text    la entradilla
-->
<article class="component-name">
  <h3 class="component-name__title">{{ item.title }}</h3>
  <p class="component-name__text mb-0">{{ item.text }}</p>
</article>
